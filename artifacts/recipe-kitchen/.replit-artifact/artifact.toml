kind = "web"
previewPath = "/"
title = "Savor & Gather"
description = "A premium, searchable recipe and food-benefits site with member favorites and a protected admin workspace for managing recipes and foods."
version = "1.0.0"
id = "artifacts/recipe-kitchen"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19542

[services.development]
run = "pnpm --filter @workspace/recipe-kitchen run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recipe-kitchen", "run", "build" ]
serve = "static"
publicDir = "artifacts/recipe-kitchen/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19542"
BASE_PATH = "/"
